name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets release.yml run this same pipeline against the tag it is about
  # to publish, instead of keeping a second, separately maintained copy
  # of the test steps.
  workflow_call:

# A new push cancels a run already in progress for the same branch or PR,
# so an outdated commit's jobs do not keep burning runner minutes once a
# newer one has superseded it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job below declares its own minimal permissions, so the default
# token grant is zero.
permissions: {}

jobs:
  # Compiles the helper and every test binary once, race detector and
  # coverage included, and saves Go's build cache (setup-go keys it on
  # go.sum). The later jobs restore it, so none of them recompiles the
  # largest packages again: the Telegram library alone takes about 5 GB
  # to compile.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compile the helper and all test binaries
        run: make test-build

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Go tests with coverage gates
        run: make test-go
      - name: JavaScript tests with coverage gates
        run: make test-js

  # Static checks and security scans over the built code.
  checks:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go lint and the privacy check
        run: |
          make tools
          build/tools/golangci-lint run ./...
          go run ./tools/nologcontent ./backend/...
          # Leftover merge conflict markers in committed files.
          ! git grep -n -E '^(<<<<<<<|>>>>>>>)( |$)'
      - name: Known vulnerabilities in dependencies
        run: make vulncheck
      - name: Dependency licenses
        run: make license-check
      - name: Shell scripts
        # GitHub's runner has shellcheck; act's smaller image does not.
        run: |
          command -v shellcheck >/dev/null || { $(command -v sudo) apt-get update -q && $(command -v sudo) apt-get install -yq shellcheck; }
          shellcheck -x scripts/*.sh bin/oma-messenger-service hooks/commit-msg

  # Runs only once everything else has passed.
  release-build:
    needs: [test, checks, qml]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Release build
        run: make build-all

  # The QML tests and Qt 6 lint need Quickshell and Omarchy's shell, so they
  # run in Arch with Omarchy's source checked out at the version the UI is
  # built against.
  qml:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel
    permissions:
      contents: read
    env:
      OMARCHY_SHELL_DIR: /tmp/omarchy/shell
    steps:
      - name: Install Quickshell, Qt 6, Go and Node
        # Arch's rolling repos move ahead of Omarchy's own shell: Qt 6.12
        # added a global QML "Color" type that shadows Omarchy's own
        # Color singleton, and Quickshell follows Qt's release. Pin Qt
        # and Quickshell to the versions .claude/rules/omarchy.md verifies
        # the shell against (install the rest from the live repos, then
        # downgrade just these in place), rather than chase whatever
        # pacman -Syu happens to pull on the day CI runs. qt6-multimedia
        # (with its FFmpeg backend) is pinned alongside them since it
        # links against the same Qt minor version.
        run: |
          pacman -Syu --noconfirm --needed git go nodejs quickshell qt6-declarative qt6-multimedia qt6-multimedia-ffmpeg
          cd /tmp
          # Each package's sha256, pinned by downloading the exact URL
          # below once and hashing it: a compromised mirror or cache
          # answering with anything else must fail the install, never
          # reach pacman -U unseen (see docs/decisions.md).
          for spec in \
            "qt6-base 6.11.2-3 257c5ef6180119d5b4365bdfe2a2ad051694b5dff390eac8e736dd78b8107b21" \
            "qt6-declarative 6.11.2-1 dcb644fab007d87711650ad46e588ad086b20aae4496845bba19b9ddf0b9855b" \
            "qt6-multimedia 6.11.2-1 1dc7671b26be1d60b8e51255552ebf5e3649fa2c2a178b5d7a07565e5454984b" \
            "qt6-multimedia-ffmpeg 6.11.2-1 5e56b0f6c0886eb033a34d1a5ce531791e7eeadb4137f9dbdbfe09bfbb9fcb44" \
            "quickshell 0.3.1-1 5988659fdc1b0addf138a3cd8e3540fc1078bfc60c995c6f4cd0fb9054484ec7"; do
            read -r name version sum <<< "$spec"
            file="$name-$version-x86_64.pkg.tar.zst"
            curl -fsSLO "https://archive.archlinux.org/packages/${name:0:1}/$name/$file"
            echo "$sum  $file" | sha256sum -c -
          done
          pacman -U --noconfirm ./*.pkg.tar.zst
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Omarchy 4.0.4
        # v4.0.4 resolves to this commit (git ls-remote --tags
        # https://github.com/basecamp/omarchy v4.0.4); pinning the
        # commit, not the tag, means a re-pushed or moved tag can never
        # silently swap in different source.
        run: |
          omarchy_commit=c668141e9c42b13c80c9ca4ea108e11708c5e8a5
          mkdir -p /tmp/omarchy
          git -C /tmp/omarchy init -q
          git -C /tmp/omarchy fetch -q --depth 1 https://github.com/basecamp/omarchy "$omarchy_commit"
          git -C /tmp/omarchy checkout -q --detach "$omarchy_commit"
          got=$(git -C /tmp/omarchy rev-parse HEAD)
          if [ "$got" != "$omarchy_commit" ]; then
            echo "omarchy checkout = $got, want $omarchy_commit" >&2
            exit 1
          fi
      - name: Offscreen QML tests
        run: make build test-qml
      - name: Qt 6 qmllint
        run: ./scripts/qml-imports.sh && /usr/lib/qt6/bin/qmllint -I build/qml --max-warnings 0 $(find ui -name '*.qml')

  # Runs the same offscreen QML tests as the "qml" job above, but against
  # whatever Qt and Quickshell Arch's rolling repos currently carry,
  # instead of the pinned versions. Nothing here gates a PR
  # (continue-on-error): it exists to notice a future Qt or Quickshell
  # release breaking this UI (as 6.12's new global "Color" type did, see
  # docs/decisions.md) before it reaches the pin in the required "qml"
  # job above, not to block on it. Omarchy stays at the same v4.0.4
  # checkout as the pinned job, so a failure here isolates to the Qt or
  # Quickshell version rather than an unrelated Omarchy change.
  qml-next:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    container: archlinux:base-devel
    permissions:
      contents: read
    env:
      OMARCHY_SHELL_DIR: /tmp/omarchy/shell
    steps:
      - name: Install current Quickshell, Qt 6, Go and Node
        run: pacman -Syu --noconfirm --needed git go nodejs quickshell qt6-declarative qt6-multimedia qt6-multimedia-ffmpeg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Omarchy 4.0.4
        # v4.0.4 resolves to this commit (git ls-remote --tags
        # https://github.com/basecamp/omarchy v4.0.4); pinning the
        # commit, not the tag, means a re-pushed or moved tag can never
        # silently swap in different source.
        run: |
          omarchy_commit=c668141e9c42b13c80c9ca4ea108e11708c5e8a5
          mkdir -p /tmp/omarchy
          git -C /tmp/omarchy init -q
          git -C /tmp/omarchy fetch -q --depth 1 https://github.com/basecamp/omarchy "$omarchy_commit"
          git -C /tmp/omarchy checkout -q --detach "$omarchy_commit"
          got=$(git -C /tmp/omarchy rev-parse HEAD)
          if [ "$got" != "$omarchy_commit" ]; then
            echo "omarchy checkout = $got, want $omarchy_commit" >&2
            exit 1
          fi
      - name: Offscreen QML tests
        run: make build test-qml
      - name: Qt 6 qmllint
        run: ./scripts/qml-imports.sh && /usr/lib/qt6/bin/qmllint -I build/qml --max-warnings 0 $(find ui -name '*.qml')
