name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `make check` minus QML lint, which needs Omarchy's shell installed.
      - name: Tests with coverage gates
        run: make test
      - name: Go lint and the privacy check
        run: |
          make tools
          build/tools/golangci-lint run ./...
          go run ./tools/nologcontent ./backend/...
      - name: Shell scripts
        run: shellcheck scripts/*.sh bin/oma-messenger-service
      - name: Release build
        run: ./scripts/build-release.sh
