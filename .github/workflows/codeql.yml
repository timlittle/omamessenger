name: CodeQL

# Scans the Go helper and the workflow files themselves for known
# vulnerability and misconfiguration patterns, and uploads the results to
# GitHub's code scanning tab. Read-only: it never changes anything in the
# repository.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 0" # weekly, Sunday 02:00 UTC

# Every job below declares its own minimal permissions, so the default
# token grant is zero.
permissions: {}

# Kept in sync by hand with the Makefile's LIBSIGNAL_COMMIT and
# LIBSIGNAL_VERSION.
env:
  LIBSIGNAL_COMMIT: 4beb029d8a941f81e7d9c6d8af1ed25a677569a8
  LIBSIGNAL_VERSION: v0.105.0

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the SARIF to code scanning
      contents: read          # checkout
      actions: read           # read workflow run details for a push-triggered scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Libsignal build tools
        if: matrix.language == 'go'
        run: |
          # CI only, so the plugin's own scripts never call sudo or a package manager.
          command -v rustup >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -yq rustup; }
          rustup toolchain install stable --profile minimal --no-self-update >/dev/null
          sudo apt-get update -q
          sudo apt-get install -yq cmake protobuf-compiler clang

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.language == 'go'
        with:
          path: build/libsignal
          key: libsignal-${{ runner.arch }}-${{ env.LIBSIGNAL_COMMIT }}

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the Go module
        # cgo on, so the Signal connector is scanned too.
        if: matrix.language == 'go'
        run: |
          make libsignal
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/build/libsignal/$LIBSIGNAL_VERSION/$(go env GOARCH)"
          go build ./...

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
