name: CodeQL

# Scans the Go helper and the workflow files themselves for known
# vulnerability and misconfiguration patterns, and uploads the results to
# GitHub's code scanning tab. Read-only: it never changes anything in the
# repository.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 0" # weekly, Sunday 02:00 UTC

# Every job below declares its own minimal permissions, so the default
# token grant is zero.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload the SARIF to code scanning
      contents: read          # checkout
      actions: read           # read workflow run details for a push-triggered scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the Go module
        # The helper never uses cgo; building it the same way the Makefile
        # does keeps this build identical to what CI and releases ship,
        # rather than relying on autobuild's own heuristics.
        if: matrix.language == 'go'
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
