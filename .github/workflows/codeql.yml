name: CodeQL

# Scans the Go helper and the workflow files themselves for known
# vulnerability and misconfiguration patterns, and uploads the results to
# GitHub's code scanning tab. Read-only: it never changes anything in the
# repository.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 0" # weekly, Sunday 02:00 UTC

# Every job below declares its own minimal permissions, so the default
# token grant is zero.
permissions: {}

# Kept in sync by hand with the Makefile's LIBSIGNAL_COMMIT and
# LIBSIGNAL_VERSION.
env:
  LIBSIGNAL_COMMIT: 4beb029d8a941f81e7d9c6d8af1ed25a677569a8
  LIBSIGNAL_VERSION: v0.105.0

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the SARIF to code scanning
      contents: read          # checkout
      actions: read           # read workflow run details for a push-triggered scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Libsignal build tools
        if: matrix.language == 'go'
        run: ./scripts/install-libsignal-build-tools.sh

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: matrix.language == 'go'
        with:
          path: build/libsignal
          key: libsignal-${{ runner.arch }}-${{ env.LIBSIGNAL_COMMIT }}

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the Go module
        # cgo on, so the Signal connector is scanned too.
        if: matrix.language == 'go'
        run: |
          make libsignal
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/build/libsignal/$LIBSIGNAL_VERSION/$(go env GOARCH)"
          go build ./...

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
