name: Dependency Review

# Flags a pull request that adds a dependency with a known vulnerability
# or a license outside this repository's allow-list, before it merges.
# make license-check catches the same license problem for Go dependencies
# already in go.sum; this also covers GitHub Actions and catches a new
# dependency at review time instead of at the next make check.
on:
  pull_request:

# The job below declares its own minimal permissions, so the default
# token grant is zero.
permissions: {}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout and read the PR's dependency diff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
