name: Release helper

# Publishes the helper for a version tag. Binaries, LICENSE-GPL-3.0 and
# THIRD_PARTY_NOTICES are attached to the GitHub Release, never committed:
# the plugin installs the binary pinned in helper-version with
# scripts/install-helper.sh, which verifies SHA256SUMS (covering all four
# files; see docs/decisions.md for why a release binary ships GPL-3.0 text).
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build provenance
      attestations: write # store the build provenance
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches helper-version
        run: test "$GITHUB_REF_NAME" = "v$(tr -d ' \n' < helper-version)"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false

      - name: Test
        run: go test -race -tags fake ./...

      - name: Build helpers, SHA256SUMS and license notices
        run: make build-all

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/release/oma-messenger-service-linux-*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/* --generate-notes
