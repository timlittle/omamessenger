name: Build helper binaries

on:
  push:
    branches: [main]
    paths-ignore:
      - "bin/**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "backend/**"
      - "go.mod"
      - "go.sum"
      - "vendor/**"
      - "scripts/build-release.sh"
      - ".github/workflows/release.yml"

jobs:
  validate-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Build Linux helpers
        run: ./scripts/build-release.sh

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Build Linux helpers
        run: ./scripts/build-release.sh

      - name: Commit updated helpers to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- bin/; then
            echo "Bundled helpers are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/oma-messenger-service-linux-amd64 bin/oma-messenger-service-linux-arm64
          git commit -m "Build bundled helper binaries [skip ci]"
          git push origin HEAD:main

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            bin/oma-messenger-service-linux-amd64 \
            bin/oma-messenger-service-linux-arm64 \
            --generate-notes
