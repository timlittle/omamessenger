name: Release helper

# Publishes the helper for a version tag. Binaries, LICENSE-GPL-3.0 and
# THIRD_PARTY_NOTICES are attached to the GitHub Release, never committed:
# the plugin installs the binary pinned in helper-version with
# scripts/install-helper.sh, which verifies SHA256SUMS (covering all four
# files; see docs/decisions.md for why a release binary ships GPL-3.0 text).
#
# Runs on a direct "v*" tag push (a manual release) and, called by
# release-please.yml right after it tags a release itself, on workflow_call
# with that tag: a tag release-please creates with GITHUB_TOKEN does not
# trigger this workflow's own "push: tags" event, so release-please.yml
# calls this workflow directly instead of relying on the tag push.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "The release tag to build and publish (defaults to the triggering tag)"
        required: false
        type: string

jobs:
  # Reruns the full CI pipeline against the tagged commit, rather than
  # trusting whatever already ran against the branch it came from, so a
  # release can never ship from code CI has not verified at this exact ref.
  ci:
    # zizmor wants the newer $/... form; actionlint v1.7.12 does not parse
    # it yet and fails the build on it, so this stays ./... until it does.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build provenance
      attestations: write # store the build provenance
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check the tag, helper-version and manifest.json agree
        run: |
          tag=${RELEASE_TAG#v}
          helper=$(cut -d'#' -f1 helper-version | tr -d ' \n')
          manifest=$(jq -r .version manifest.json)
          if [ "$tag" != "$helper" ] || [ "$tag" != "$manifest" ]; then
            printf 'version mismatch: tag=v%s helper-version=%s manifest.json=%s\n' "$tag" "$helper" "$manifest" >&2
            exit 1
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
          cache: false

      - name: Build helpers, SHA256SUMS and license notices
        run: make build-all

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: build/release/oma-messenger-service-linux-*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" build/release/* --generate-notes
