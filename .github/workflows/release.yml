name: Release helper

# Publishes the helper for a version tag. Binaries, LICENSE-GPL-3.0 and
# THIRD_PARTY_NOTICES are attached to the GitHub Release, never committed:
# the plugin installs the binary pinned in helper-version with
# scripts/install-helper.sh, which verifies it against the SHA-256
# committed in helper-checksums (see docs/decisions.md for why a committed
# hash, not the release's own SHA256SUMS, is the authority, and for why a
# release binary ships GPL-3.0 text). Once the release's assets exist, the
# pin-checksums job below computes their SHA-256 and opens a pull request
# to commit them, rather than pushing straight to main, so the pin a
# reviewer sees land through is a normal diff.
#
# Runs on a direct "v*" tag push (a manual release) and, called by
# release-please.yml right after it tags a release itself, on workflow_call
# with that tag: a tag release-please creates with GITHUB_TOKEN does not
# trigger this workflow's own "push: tags" event, so release-please.yml
# calls this workflow directly instead of relying on the tag push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild and publish assets for"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "The release tag to build and publish (defaults to the triggering tag)"
        required: false
        type: string

# Every job below declares its own minimal permissions, so the default
# token grant is zero.
permissions: {}

jobs:
  # Reruns the full CI pipeline against the tagged commit, rather than
  # trusting whatever already ran against the branch it came from, so a
  # release can never ship from code CI has not verified at this exact ref.
  ci:
    # zizmor wants the newer $/... form; actionlint v1.7.12 does not parse
    # it yet and fails the build on it, so this stays ./... until it does.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build provenance
      attestations: write # store the build provenance
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check the tag, helper-version, manifest.json and the compiled-in version agree
        run: |
          tag=${RELEASE_TAG#v}
          helper=$(cut -d'#' -f1 helper-version | tr -d ' \n')
          manifest=$(jq -r .version manifest.json)
          compiled=$(sed -n 's/.*helperVersion = "\([^"]*\)".*/\1/p' backend/config.go)
          if [ "$tag" != "$helper" ] || [ "$tag" != "$manifest" ] || [ "$tag" != "$compiled" ]; then
            printf 'version mismatch: tag=v%s helper-version=%s manifest.json=%s compiled-in=%s\n' "$tag" "$helper" "$manifest" "$compiled" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build helpers, SHA256SUMS and license notices
        run: make build-all

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release/oma-messenger-service-linux-*

      - name: Publish the release
        # release-please already created the GitHub Release (and its tag)
        # before calling this workflow, so that path uploads assets to the
        # existing release instead of trying to create it a second time.
        # A direct "v*" tag push (a manual release) has no release yet, so
        # that path still creates it. workflow_dispatch rebuilds and
        # re-publishes an existing tag's assets, so it also uploads.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/release/* --clobber
          else
            gh release create "$RELEASE_TAG" build/release/* --generate-notes
          fi

  # Computes the SHA-256 of the binaries the release job just published
  # and opens a pull request committing them to helper-checksums, rather
  # than pushing to main directly, so the pin is a reviewed diff like any
  # other change. GitHub never lets a GITHUB_TOKEN-authored pull request
  # trigger a workflow run of its own (the same protection that makes
  # release-please.yml call this workflow directly instead of relying on
  # its tag push), so this pull request starts with no checks; the
  # maintainer re-runs or approves CI on it by hand before merging (see
  # README).
  pin-checksums:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # push the pin branch
      pull-requests: write # open the pull request
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # persist-credentials stays at its default (true): this step needs
      # it to push the pin branch below, with the same token this job's
      # permissions already scope to this one push and pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Compute the release's checksums and open a pull request to pin them
        run: |
          version=${RELEASE_TAG#v}
          branch="pin-helper-$version"

          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          gh release download "$RELEASE_TAG" -p SHA256SUMS -D "$dir"

          {
            echo "# SHA-256 checksums for the helper binaries released for the version"
            echo "# pinned in helper-version, committed here so scripts/install-helper.sh"
            echo "# verifies a download against a hash that ships in this reviewed commit"
            echo "# rather than one fetched from the same release it is checking (see"
            echo "# docs/decisions.md). A release's follow-up pull request adds this"
            echo "# file's entries once the release's assets exist; release-please never"
            echo "# touches this file, so a version bump alone leaves it with no entry"
            echo "# for the new version until that follow-up pin lands."
            echo "#"
            echo "# sha256  oma-messenger-service-<version>-linux-<arch>"
            for arch in amd64 arm64; do
              name="oma-messenger-service-linux-$arch"
              hash=$(awk -v n="$name" '$2 == n { print $1 }' "$dir/SHA256SUMS")
              if [ -z "$hash" ]; then
                printf 'pin-checksums: release %s has no checksum for %s\n' "$RELEASE_TAG" "$name" >&2
                exit 1
              fi
              printf '%s  oma-messenger-service-%s-linux-%s\n' "$hash" "$version" "$arch"
            done
          } > helper-checksums

          if git diff --quiet -- helper-checksums; then
            echo "pin-checksums: helper-checksums already matches $RELEASE_TAG; nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add helper-checksums

          msg=$(mktemp)
          cat >"$msg" <<EOF
          build(release): pin helper checksums for v$version

          Commits the SHA-256 of v$version's helper binaries, computed from the
          release's own SHA256SUMS right after this workflow published it, so
          scripts/install-helper.sh verifies a download against a hash that
          ships in a reviewed commit rather than one fetched from the same
          release it is checking.
          EOF
          git commit -F "$msg"
          git push -f -u origin "$branch"

          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" != "0" ]; then
            echo "pin-checksums: a pull request for $branch is already open; pushed the update to it"
            exit 0
          fi

          body=$(mktemp)
          cat >"$body" <<EOF
          Pins v$version's helper binaries' SHA-256 (see docs/decisions.md).

          This pull request was opened with the workflow's own token, which
          GitHub never lets trigger a check run on its own pull requests: it
          has no checks yet. Re-run or approve CI on it by hand before merging.
          EOF
          gh pr create --title "build(release): pin helper checksums for v$version" \
            --body-file "$body" --head "$branch" --base main
