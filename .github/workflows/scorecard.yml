name: Scorecard

# OpenSSF Scorecard scores the repository's supply-chain security
# practices (branch protection, pinned actions, review requirements, ...)
# and publishes the result to the public Scorecard API and GitHub's code
# scanning tab. Read-only: it never changes anything in the repository.
on:
  schedule:
    - cron: "30 1 * * 6" # weekly, Saturday 01:30 UTC
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout
      security-events: write # upload the SARIF to code scanning
      id-token: write       # publish the result to the Scorecard API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: results.sarif
