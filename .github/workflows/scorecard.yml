name: Scorecard

# OpenSSF Scorecard scores the repository's supply-chain security
# practices (branch protection, pinned actions, review requirements, ...)
# and publishes the result to the public Scorecard API and GitHub's code
# scanning tab. Read-only: it never changes anything in the repository.
on:
  schedule:
    - cron: "30 1 * * 6" # weekly, Saturday 01:30 UTC
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout
      security-events: write # upload the SARIF to code scanning
      id-token: write       # publish the result to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
