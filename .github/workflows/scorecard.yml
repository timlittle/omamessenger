name: Scorecard

# OpenSSF Scorecard scores the repository's supply-chain security
# practices (branch protection, pinned actions, review requirements, ...)
# and publishes the result to the public Scorecard API and GitHub's code
# scanning tab. Read-only: it never changes anything in the repository.
on:
  schedule:
    - cron: "30 1 * * 6" # weekly, Saturday 01:30 UTC
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout
      security-events: write # upload the SARIF to code scanning
      id-token: write       # publish the result to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
