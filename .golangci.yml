# Lint configuration. `make lint` runs the version pinned in the Makefile.
# The rules behind these settings are in .claude/rules/go-style.md.
version: "2"

run:
  build-tags: [fake] # lint the test wiring too; nofake.go is two lines

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - depguard     # which internal packages each package may import
    - revive       # size, complexity and doc comment rules
    - nolintlint   # every //nolint names the linter and gives a reason
    - gosec        # common security mistakes (weak randomness, file perms, ...)
    - errorlint    # %w wrapping, errors.Is/As instead of comparing error values
    - bodyclose    # every http.Response.Body is closed
    - contextcheck # a context passed to a callee came from this function's own argument, not a fresh one
    - noctx        # no HTTP request without a context
    - nilerr       # a function does not return nil when the err it checked is non-nil
    - misspell     # misspelled words in comments and strings
    - gocritic     # diagnostic-tag checks only; see settings below for why
  settings:
    gocritic:
      # Style and performance checks are opinionated and noisy; the
      # diagnostic tag is the small, high-signal subset that is actually
      # finding bugs rather than offering taste.
      enabled-tags: [diagnostic]
    gosec:
      excludes:
        - G304 # every path gosec flags here is this helper's own cache, session or attachment path, never raw untrusted input
        - G115 # every conversion gosec flags here is a bounded domain value (a timestamp, a file size, pixel dimensions, a random id's own bits)
    depguard:
      # Production files only; tests may import more, such as a real store.
      # The main package (backend/*.go) wires everything and may import
      # anything. Entries ending in $ are exact; others are prefixes.
      rules:
        domain:
          list-mode: strict
          files: ["**/backend/internal/domain/*.go", "!$test"]
          allow: [$gostd]
        store:
          list-mode: strict
          files: ["**/backend/internal/store/*.go", "!$test"]
          allow:
            - $gostd
            - modernc.org/sqlite
            - github.com/timlittle/omamessenger/backend/internal/domain$
        connector:
          list-mode: strict
          files: ["**/backend/internal/connector/*.go", "!$test"]
          allow:
            - $gostd
            - github.com/timlittle/omamessenger/backend/internal/domain$
        connectortest:
          list-mode: strict
          files: ["**/backend/internal/connector/connectortest/*.go"]
          allow:
            - $gostd
            - github.com/timlittle/omamessenger/backend/internal/connector$
            - github.com/timlittle/omamessenger/backend/internal/domain$
        fake:
          list-mode: strict
          files: ["**/backend/internal/connector/fake/*.go", "!$test"]
          allow:
            - $gostd
            - github.com/timlittle/omamessenger/backend/internal/connector$
            - github.com/timlittle/omamessenger/backend/internal/domain$
        telegram:
          list-mode: strict
          files: ["**/backend/internal/connector/telegram/*.go", "!$test"]
          allow:
            - $gostd
            - github.com/gotd/td
            - rsc.io/qr
            - github.com/timlittle/omamessenger/backend/internal/connector$
            - github.com/timlittle/omamessenger/backend/internal/domain$
        whatsapp:
          list-mode: strict
          files: ["**/backend/internal/connector/whatsapp/*.go", "!$test"]
          allow:
            - $gostd
            - go.mau.fi/whatsmeow
            - google.golang.org/protobuf
            - rsc.io/qr
            - modernc.org/sqlite
            - github.com/timlittle/omamessenger/backend/internal/connector$
            - github.com/timlittle/omamessenger/backend/internal/domain$
        policy:
          list-mode: strict
          files: ["**/backend/internal/app/policy/*.go", "!$test"]
          allow:
            - $gostd
            - github.com/timlittle/omamessenger/backend/internal/domain$
        doctor:
          list-mode: strict
          files: ["**/backend/internal/doctor/*.go", "!$test"]
          allow:
            - $gostd
        app:
          list-mode: strict
          files: ["**/backend/internal/app/*.go", "!$test"]
          allow:
            - $gostd
            - github.com/timlittle/omamessenger/backend/internal/app/policy$
            - github.com/timlittle/omamessenger/backend/internal/connector$
            - github.com/timlittle/omamessenger/backend/internal/doctor$
            - github.com/timlittle/omamessenger/backend/internal/domain$
            - github.com/timlittle/omamessenger/backend/internal/store$
        server:
          list-mode: strict
          files: ["**/backend/internal/server/*.go", "!$test"]
          allow:
            - $gostd
            - github.com/sourcegraph/jsonrpc2
            - github.com/timlittle/omamessenger/backend/internal/app$
            - github.com/timlittle/omamessenger/backend/internal/domain$
        cache:
          list-mode: strict
          files: ["**/backend/internal/cache/*.go", "!$test"]
          allow: [$gostd]
        notify:
          list-mode: strict
          files: ["**/backend/internal/notify/*.go", "!$test"]
          allow: [$gostd]
        clipboard:
          list-mode: strict
          files: ["**/backend/internal/clipboard/*.go", "!$test"]
          allow: [$gostd]
    revive:
      rules:
        - name: function-length
          arguments: [0, 50] # [statements (off), lines]
        - name: max-control-nesting
          arguments: [3]
        - name: cyclomatic
          arguments: [10]
        - name: argument-limit
          arguments: [5]
        - name: file-length-limit
          arguments: [{max: 400, skip-comments: true, skip-blank-lines: true}]
        - name: exported
        - name: package-comments
        - name: receiver-naming
        - name: var-naming
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: early-return
        - name: unused-receiver
        - name: context-as-argument
          arguments: [{allowTypesBefore: "*testing.T"}]
        - name: context-keys-type
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [revive]
        text: "function-length|cyclomatic|exported|unused-receiver"
      # Tests routinely chmod a t.TempDir() to simulate a denied write,
      # write and exec a fixture binary or script they just built
      # themselves, and read back a file they just wrote: gosec cannot
      # tell that apart from a real permission or injection risk, so it
      # does not run over tests at all rather than needing a nolint on
      # nearly every file in the suite.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable: [gofumpt]
