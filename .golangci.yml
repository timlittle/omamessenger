# Lint configuration. `make lint` runs the version pinned in the Makefile.
# The rules behind these settings are in .claude/rules/go-style.md.
version: "2"

run:
  build-tags: [fake] # lint the test wiring too; nofake.go is two lines

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - depguard   # which internal packages each package may import
    - revive     # size, complexity and doc comment rules
    - nolintlint # every //nolint names the linter and gives a reason
  settings:
    depguard:
      # Production files only; tests may import more, such as a real store.
      # The main package (backend/*.go) wires everything and may import
      # anything. Entries ending in $ are exact; others are prefixes.
      rules:
        domain:
          list-mode: strict
          files: ["**/backend/internal/domain/*.go", "!$test"]
          allow: [$gostd]
        store:
          list-mode: strict
          files: ["**/backend/internal/store/*.go", "!$test"]
          allow:
            - $gostd
            - modernc.org/sqlite
            - github.com/timlittle/omamessenger/backend/internal/domain$
        connector:
          list-mode: strict
          files: ["**/backend/internal/connector/*.go", "!$test"]
          allow:
            - $gostd
            - github.com/timlittle/omamessenger/backend/internal/domain$
        connectortest:
          list-mode: strict
          files: ["**/backend/internal/connector/connectortest/*.go"]
          allow:
            - $gostd
            - github.com/timlittle/omamessenger/backend/internal/connector$
            - github.com/timlittle/omamessenger/backend/internal/domain$
        fake:
          list-mode: strict
          files: ["**/backend/internal/connector/fake/*.go", "!$test"]
          allow:
            - $gostd
            - github.com/timlittle/omamessenger/backend/internal/connector$
            - github.com/timlittle/omamessenger/backend/internal/domain$
        telegram:
          list-mode: strict
          files: ["**/backend/internal/connector/telegram/*.go", "!$test"]
          allow:
            - $gostd
            - github.com/gotd/td
            - rsc.io/qr
            - github.com/timlittle/omamessenger/backend/internal/connector$
            - github.com/timlittle/omamessenger/backend/internal/domain$
        policy:
          list-mode: strict
          files: ["**/backend/internal/app/policy/*.go", "!$test"]
          allow:
            - $gostd
            - github.com/timlittle/omamessenger/backend/internal/domain$
        app:
          list-mode: strict
          files: ["**/backend/internal/app/*.go", "!$test"]
          allow:
            - $gostd
            - github.com/timlittle/omamessenger/backend/internal/app/policy$
            - github.com/timlittle/omamessenger/backend/internal/connector$
            - github.com/timlittle/omamessenger/backend/internal/domain$
            - github.com/timlittle/omamessenger/backend/internal/store$
        server:
          list-mode: strict
          files: ["**/backend/internal/server/*.go", "!$test"]
          allow:
            - $gostd
            - github.com/sourcegraph/jsonrpc2
            - github.com/timlittle/omamessenger/backend/internal/app$
            - github.com/timlittle/omamessenger/backend/internal/domain$
        cache:
          list-mode: strict
          files: ["**/backend/internal/cache/*.go", "!$test"]
          allow: [$gostd]
        notify:
          list-mode: strict
          files: ["**/backend/internal/notify/*.go", "!$test"]
          allow: [$gostd]
        clipboard:
          list-mode: strict
          files: ["**/backend/internal/clipboard/*.go", "!$test"]
          allow: [$gostd]
    revive:
      rules:
        - name: function-length
          arguments: [0, 50] # [statements (off), lines]
        - name: max-control-nesting
          arguments: [3]
        - name: cyclomatic
          arguments: [10]
        - name: argument-limit
          arguments: [5]
        - name: file-length-limit
          arguments: [{max: 400, skip-comments: true, skip-blank-lines: true}]
        - name: exported
        - name: package-comments
        - name: receiver-naming
        - name: var-naming
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: early-return
        - name: unused-receiver
        - name: context-as-argument
          arguments: [{allowTypesBefore: "*testing.T"}]
        - name: context-keys-type
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [revive]
        text: "function-length|cyclomatic|exported|unused-receiver"

formatters:
  enable: [gofumpt]
