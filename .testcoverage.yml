# Statement coverage gates per package, checked by `make test-go`.
profile: build/cover.out
threshold:
  package: 90
override:
  - path: ^backend/internal/domain$
    threshold: 100
  - path: ^backend/internal/app/policy$
    threshold: 100
  - path: ^backend/internal/notify$
    threshold: 75
  # Run, sign-in and the gotd adapter need a live Telegram connection;
  # everything they call is tested against a fake API.
  - path: ^backend/internal/connector/telegram$
    threshold: 80
  - path: ^backend$
    threshold: 80
exclude:
  paths:
    # Test support shared by the connector tests; they exercise it.
    - ^backend/internal/connector/connectortest/
