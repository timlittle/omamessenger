# Fixture for tests/qml/KeyBindings/shell.qml: remaps the command
# palette, and separately the command it is used to run, off their
# defaults onto keys nothing else uses, so the test can tell the
# overrides applied from their defaults no longer firing.
palette.commands = Ctrl+Alt+P
chat.new = Ctrl+Alt+N

# Also exercises error reporting: an unknown action and a malformed key
# must be reported without breaking the valid overrides above.
bogus.action = Ctrl+Alt+Z
unread.next = NotAKey
